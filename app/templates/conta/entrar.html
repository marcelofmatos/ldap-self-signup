{% extends "base.html" %}
{% block conteudo %}
<h1>Entrar</h1>
{% if erro %}<p class="erro" role="alert">{{ erro }}</p>{% endif %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="uid">Usuário</label><input id="uid" name="uid" autocomplete="username" required autofocus>
  <label for="senha">Senha</label><input id="senha" name="senha" type="password" autocomplete="current-password" required>
  <button type="submit">Entrar</button>
</form>
<p class="mudo"><a href="{{ url_for('publico.esqueci_senha_form') }}">Esqueci minha senha</a></p>
<p class="mudo">Ainda não tem conta? <a href="{{ url_for('publico.formulario') }}">Solicite acesso</a>.</p>
{% endblock %}
