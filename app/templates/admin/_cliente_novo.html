<script>
// Mostra o nome e a confirmação do cliente novo só quando o cliente escolhido é "Novo cliente…".
// Escondidos, os campos ficam desabilitados e não são enviados. Sem JavaScript o bloco fica sempre visível.
// Cada bloco segue o seletor de cliente do próprio formulário (a página pode ter mais de um).
(function () {
  document.querySelectorAll('.cliente-novo').forEach(function (bloco) {
    var form = bloco.closest('form');
    var cliente = form && form.querySelector('select[name=organizacao]');
    if (!cliente) return;
    function ajustar() {
      var novo = cliente.value === '__nova__';
      bloco.hidden = !novo;
      bloco.querySelectorAll('input').forEach(function (campo) { campo.disabled = !novo; });
      return novo;
    }
    cliente.addEventListener('change', function () {
      if (ajustar()) bloco.querySelector('input[name=organizacao_nova]').focus();
    });
    ajustar();
  });
})();
</script>
