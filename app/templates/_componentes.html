{#- CSS dos componentes do app. Um tema com paginas/base.html próprio deve incluir este arquivo
    ({% include "_componentes.html" %} depois do seu <style>) para receber os estilos das versões novas. #}
<style>
input[type=checkbox],label.check input[type=checkbox]{width:20px;height:20px;padding:0;margin:0;vertical-align:middle;accent-color:var(--p);cursor:pointer}
label.check input[type=checkbox]{margin-right:8px}
a.botao{display:inline-block;background:var(--p);color:#fff;border-radius:6px;padding:10px 18px;text-decoration:none;font-weight:600}
.card-faltam{border:1px solid #f59e0b;background:#fff6e9;border-radius:8px;padding:16px 20px;margin:16px 0}
.card-faltam p{margin:0 0 12px}
table.lista td.grupos{max-width:160px;overflow:hidden;text-overflow:ellipsis}
button.icone{display:inline-flex;align-items:center;justify-content:center;padding:6px 8px}
table.lista td.acoes form{display:inline-block}
table.lista td.acoes form + form{margin-left:4px}
.st-alteracao{background:#fce7f3;color:#9d174d}
.servicos{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin:12px 0}
a.servico{display:flex;flex-direction:column;gap:6px;border:1px solid #d9dee5;border-radius:8px;padding:16px;background:#fff;color:inherit;text-decoration:none}
a.servico:hover{border-color:var(--p)}
a.servico:focus-visible{border-color:var(--p);outline:2px solid var(--p);outline-offset:2px}
a.servico svg{width:28px;height:28px;color:var(--p)}
a.servico .titulo{font-weight:700}
a.servico .descricao{color:#6b7280;font-size:.9em}
.topo-conta{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.topo-conta form{margin:0;flex:none}
.topo-acoes{display:flex;align-items:center;gap:8px;flex:none}
.topo-conta button{margin:0;padding:6px 14px;background:#fff;color:inherit;border:1px solid #d1d5db}
.topo-conta button:hover{border-color:var(--p)}
</style>
